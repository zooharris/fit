        text: `See a professional fitter before changing the ${map.thing} again.`,
        why: `Your ${label.toLowerCase()} has been ${nowSide.side === 'low' ? 'below' : 'above'} the target range for ${N} sessions in a row, even though ${map.obj} was ${map.did[k]} each time (${deltas.map((d) => fmtLength(Math.abs(d), units, 'adjust')).join(', then ')}). The app's suggestions aren't working for you, so a professional should look before you change anything else.`,
        note: '', howTo: '', history: Object.assign(out.history, { status: 'professional' }),
      });
    }
  }

  if (madeAbs < tol) {
    // Not made: say so instead of presenting the same advice as new.
    const now = fmtLength(bikeNow[map.measure], units, 'length');
    return Object.assign(out, {
      text: `Still to do: ${step.text.charAt(0).toLowerCase()}${step.text.slice(1)}`,
      why: `The marks show the ${map.thing} hasn't changed since your last session (${step.id === 'saddleHeight' ? `${now} to the saddle nose` : `setback ${now}`}), so last time's suggestion still stands. ${step.why}`,
      history: Object.assign(out.history, { status: 'notMade' }),
    });
  }
  if (!made) {
    return Object.assign(out, {
      why: `The marks show the saddle was ${map.did[madeDir > 0 ? 0 : 1]} ${fmtLength(madeAbs, units, 'adjust')} since your last session; the suggestion was to ${map.imper[k]} ${fmtRange(lo, hi, units)}. ${step.why}`,
      history: Object.assign(out.history, { status: 'different' }),
    });
  }
  // Made. Did the measurement move towards the band?
  const towards = finite(prevV) && finite(nowV) && (nowSide.side === 'low' ? nowV > prevV : nowV < prevV);
  if (towards && step.direction === dir) {
    const amountText = step.amount ? fmtRange(step.amount.lo, step.amount.hi, units) : `a little (about ${fmtLength(R.saddleStepMm, units, 'adjust')})`;
    return Object.assign(out, {
      text: `One more step: ${map.imper[step.direction > 0 ? 0 : 1]} ${amountText}, then retest.`,
      why: `Your ${label.toLowerCase()} went from ${fmtV(prevV)} to ${fmtV(nowV)} after ${changeWords(madeMm)}, and is still ${sideWords(nowV, band, nowSide.side)} the target range of ${fmtBand(metric, band, units)}.`,
      history: Object.assign(out.history, { status: 'progress' }),
    });
  }
  return Object.assign(out, {
    why: `Your ${label.toLowerCase()} went from ${fmtV(prevV)} to ${fmtV(nowV)} after ${changeWords(madeMm)}. ${step.why}`,
    history: Object.assign(out.history, { status: 'noImprovement' }),
  });
}

function describeOut(pairs, m, targets, units) {
  return pairs.filter(([, c]) => c.status === 'red' || c.status === 'yellow')
    .map(([k, c]) => `${METRICS[k].label} ${fmtMetric(k, m[k].value, units)} is ${c.side === 'low' ? 'below' : 'above'} ${fmtBand(k, targets[k], units)}`).join('; ') + '.';
}

/* ==========================================================================
   Discomfort: focus and gate, never diagnosis (brief section 7)
   ========================================================================== */
function discomfortGate(answers) {
  const D = TF_CONFIG.discomfort;
  if (!answers) return { gated: false, reasons: [] };
  const reasons = [];
  for (const r of D.regions) {
    const a = answers.regions && answers.regions[r];
    if (!a) continue;
    if (a.level === D.gateOnLevel) reasons.push(`severe discomfort (${REGIONS[r].label.toLowerCase()})`);
    else if (a.level !== 'none' && a.pattern === D.gateOnPattern) reasons.push(`discomfort that lasts after rides (${REGIONS[r].label.toLowerCase()})`);
  }
  if (answers.numbness) reasons.push('numbness');
  if (answers.recentInjury) reasons.push('a recent injury or medical treatment');
  return { gated: reasons.length > 0, reasons };
}

/**
 * discomfortNotes — for each region with discomfort, what the measurements say, in careful language.
 * Never states a cause; never invents a fit problem; says plainly when the related measurements are in range.
 */
function discomfortNotes(answers, analysis, targets, units) {
  const notes = [];
  if (!answers || !answers.regions) return notes;
  const order = { severe: 0, moderate: 1, mild: 2 };
  const regions = Object.entries(answers.regions)
    .filter(([, a]) => a && a.level && a.level !== 'none')
    .sort((a, b) => order[a[1].level] - order[b[1].level]);
  for (const [key, a] of regions) {
    const reg = REGIONS[key];
    if (!reg) continue;
    const note = { region: key, label: reg.label, level: a.level, pattern: a.pattern, highlight: [], text: '' };
    if (!reg.assoc.length) { note.text = reg.notMeasurable; notes.push(note); continue; }
    const out = [], measured = [], otherWay = [];
    for (const as of reg.assoc) {
      const mm = analysis.metrics[as.metric];
      if (!mm || !finite(mm.value) || mm.confidence === 'low' || mm.confidence === 'none') continue;
      const c = classify(mm.value, targets[as.metric]);
      measured.push({ metric: as.metric, c, value: mm.value });
      if (c.status !== 'green' && c.side === as.when) out.push({ as, c, value: mm.value });
    }
    note.highlight = [...new Set(out.map((o) => o.as.metric))];
    const aspect = { kneeFront: 'saddle position', kneeBack: 'saddle height', hands: 'reach and bar position', neckShoulders: 'reach and bar height', lowerBack: 'saddle and bar position', saddle: 'saddle height', feet: 'saddle height' }[key] || 'bike fit';
    const seen = new Set();
    const uniq = measured.filter((x) => (seen.has(x.metric) ? false : seen.add(x.metric)));
    const label = (k) => METRICS[k].label.toLowerCase();
    const list = (arr) => (arr.length === 1 ? arr[0] : `${arr.slice(0, -1).join(', ')} and ${arr[arr.length - 1]}`);
    if (out.length) {
      const o = out[0];
      note.text = `${capitalise(reg.phrase)} is often associated with ${o.as.cause}. Your ${label(o.as.metric)} is ${fmtMetric(o.as.metric, o.value, units)}, ${o.c.side === 'low' ? 'below' : 'above'} the target range of ${fmtBand(o.as.metric, targets[o.as.metric], units)}, so this is worth checking first.`;
      const rest = [...new Set(out.slice(1).map((x) => x.as.metric))].filter((k) => k !== o.as.metric);
      if (rest.length) note.text += ` Also outside its range: ${rest.map((k) => `${label(k)} (${fmtMetric(k, analysis.metrics[k].value, units)})`).join(', ')}.`;
      note.text += ' A fit change may or may not help; if the discomfort continues, see a professional.';
    } else if (uniq.length) {
      const green = uniq.filter((x) => x.c.status === 'green').map((x) => label(x.metric));
      const other = uniq.filter((x) => x.c.status !== 'green');
      const parts = [];
      if (green.length) parts.push(`Your ${list(green)} ${green.length > 1 ? 'are' : 'is'} within range`);
      if (other.length) parts.push(`${green.length ? 'your' : 'Your'} ${list(other.map((x) => `${label(x.metric)} is ${x.c.side === 'low' ? 'below' : 'above'} range`))}, which is not the direction usually associated with ${reg.phrase}`);
      if (other.length) {
        note.text = `${parts.join(', and ')}. Any change suggested for those measurements is about the measurements themselves, not this discomfort. ${OTHER_CAUSES}`;
      } else {
        note.text = `${parts.join(', and ')}, so ${aspect} is unlikely to be the main factor. ${OTHER_CAUSES}`;
      }
      note.inRange = true;
    } else {
      note.text = 'The measurements related to this were not clear enough in this recording to say anything about it. Try a retest with better light, or see a professional.';
    }
    if (reg.partial) note.text += ` ${reg.partial}`;
    notes.push(note);
  }
  return notes;
}

/* ==========================================================================
   Session results: everything the dashboard and report show
   ========================================================================== */
function buildResults(analysis, profile, hand, discomfort, units, opts) {
  const targets = targetsFor(profile, hand);
  const o = opts || {};
  const rec = analysis.ok ? recommend(analysis, targets, { units, history: o.history, bikeMeasures: o.bikeMeasures }) : null;
  const gate = discomfortGate(discomfort);
  const notes = analysis.ok ? discomfortNotes(discomfort, analysis, targets, units) : [];
  const gauges = METRIC_ORDER.map((k) => {
    const mm = analysis.metrics && analysis.metrics[k];
    const c = classify(mm && mm.value, targets[k]);
    return { metric: k, value: mm ? mm.value : NaN, spread: mm ? mm.spread : NaN, confidence: mm ? mm.confidence : 'none', reason: mm ? mm.reason : '', band: targets[k], status: mm && (mm.confidence === 'low' || mm.confidence === 'none') ? 'none' : c.status, side: c.side };
  });
  // Regions the rider flagged come first: their highlighted metrics lead the gauge list.
  const highlighted = new Set(notes.flatMap((n) => n.highlight));
  gauges.sort((a, b) => (highlighted.has(b.metric) ? 1 : 0) - (highlighted.has(a.metric) ? 1 : 0));
  return { targets, recommendation: rec, gate, discomfortNotes: notes, gauges, highlighted: [...highlighted] };
}

/**
 * retestSummary(prevSession, nowSession, metric, units) — the retest strip (brief C1.3): what the marks say changed
 * on the bike and how the measurement the advice was about moved. Sessions carry bikeMeasures and their first
 * clip's calibration; metric values come from the caller (analysis of each session).
 */
function retestSummary(prev, now, metric, prevValue, nowValue, units) {
  const cmp = compareMarks(prev.cal, now.cal);
  const parts = [];
  const words = { saddleHeight: 'saddle', saddleSetback: 'setback', drop: 'drop', reach: 'reach' };
  if (cmp && cmp.changes) {
    const nb = now.cal && now.cal.bikeMeasures, pb = prev.cal && prev.cal.bikeMeasures;
    const tol = TF_CONFIG.recommend.madeToleranceMm;
    const r = (v) => Math.round(v);
    if (nb && pb) {
      // The saddle. Raising it up a sloping seat post also moves the nose back a little; that part is left out
      // so "setback" appears only when the saddle was moved on its rails.
      const dh = nb.saddleHeight - pb.saddleHeight;
      if (finite(dh) && Math.abs(r(dh)) >= tol) parts.push(`${words.saddleHeight} ${fmtSignedMm(r(dh), units)}`);
      const ds = nb.saddleSetback - pb.saddleSetback - (finite(dh) ? dh * Math.cos(TF_CONFIG.camera.seatTubeAngleDeg * Math.PI / 180) : 0);
      if (finite(ds) && Math.abs(r(ds)) >= tol) parts.push(`saddle ${fmtLength(Math.abs(r(ds)), units, 'adjust')} ${ds > 0 ? 'further back' : 'further forward'} on its rails`);
      // The bars: drop and reach also change when only the saddle moves, so take out the saddle's part and
      // report the bars only when they moved themselves (height above the bottom bracket, distance in front of it).
      const R = Math.PI / 180;
      const barUp = (m) => m.saddleHeight * Math.sin(m.effectiveSeatAngle * R) - m.drop;
      const barFwd = (m) => m.reach - m.saddleSetback;
      if ([nb, pb].every((m) => ['saddleHeight', 'effectiveSeatAngle', 'drop', 'reach', 'saddleSetback'].every((k) => finite(m[k])))) {
        const up = r(barUp(nb) - barUp(pb)), fwd = r(barFwd(nb) - barFwd(pb));
        if (Math.abs(up) >= tol) parts.push(`bars ${fmtLength(Math.abs(up), units, 'adjust')} ${up > 0 ? 'higher' : 'lower'}`);
        if (Math.abs(fwd) >= tol) parts.push(`bars ${fmtLength(Math.abs(fwd), units, 'adjust')} ${fwd > 0 ? 'further forward' : 'further back'}`);
      }
    } else {
      for (const k of ['saddleHeight', 'saddleSetback']) {
        const d = cmp.changes[k];
        if (finite(d) && Math.abs(d) >= tol) parts.push(`${words[k]} ${fmtSignedMm(d, units)}`);
      }
    }
    if (!parts.length) parts.push('no change to the bike');
  }
  const ms = finite(prevValue) && finite(nowValue) ? `${METRICS[metric].label.toLowerCase()} ${fmtMetric(metric, prevValue, units)} → ${fmtMetric(metric, nowValue, units)}` : '';
  return { bike: parts.length ? `${parts.join(', ')} (measured)` : '', metric: ms, cameraMoved: !!(cmp && cmp.cameraMoved), changes: cmp ? cmp.changes : null };
}

/* ==========================================================================
   Fit file model (brief section 10). Pure data operations; zipping lives in the app.
   ========================================================================== */
function newFitFile(name) {
  const now = new Date().toISOString();
  return { format: TF_CONFIG.app.fileFormat, schema: TF_CONFIG.app.schemaVersion, app: TF_CONFIG.app.name, appVersion: TF_CONFIG.app.version, name: name || 'My fits', created: now, modified: now, riders: [], extra: {} };
}
function newRider(name) {
  const now = new Date().toISOString();
  return {
    id: uid('r'), name: name || 'Rider', created: now, modified: now,
    profile: { bikeType: 'road', goal: 'endurance', hands: ['hoods'], height: null, inseam: null, age: null, sex: '', flexibility: '' },
    bike: { name: '', crankLength: 172.5, wheel: TF_CONFIG.calibration.defaultWheel, wheelDiameterMm: null },
    sessions: [],
  };
}
function newSession(rider) {
  const now = new Date().toISOString();
  return {
    id: uid('s'), riderId: rider.id, created: now, modified: now,
    profile: JSON.parse(JSON.stringify(rider.profile)), bike: JSON.parse(JSON.stringify(rider.bike)),
    discomfort: null, clips: [], snapshots: [], reports: [], results: null, retestOf: null, note: '',
    // 2.0 (schema 2)
    marks: null, bikeMeasures: null, markedWithRider: null, secondClip: null, replies: [],
  };
}

/** Move an older file forward. Unknown fields are always preserved. */
function migrateFile(obj) {
  if (!obj || obj.format !== TF_CONFIG.app.fileFormat) throw new Error('This is not a Tango Fitter file.');
  const schema = Number(obj.schema) || 0;
  if (schema > TF_CONFIG.app.schemaVersion) {
    // A newer app wrote this. Keep everything; the app may not understand all of it.
    obj._newerSchema = schema;
  }
  if (!Array.isArray(obj.riders)) obj.riders = [];
  for (const r of obj.riders) {
    if (!Array.isArray(r.sessions)) r.sessions = [];
    r.profile = Object.assign(newRider().profile, r.profile || {});
    r.bike = Object.assign(newRider().bike, r.bike || {});
    for (const s of r.sessions) {
      s.clips = s.clips || []; s.snapshots = s.snapshots || []; s.reports = s.reports || [];
      // Schema 1 → 2: Beta 1 tapped six points with the rider on the bike; there was no saddle nose or bar top,
      // so the bike's own numbers are absent.
      if (!('marks' in s)) {
        const cal = s.clips[0] && s.clips[0].calibration;
        s.marks = cal && cal.taps ? JSON.parse(JSON.stringify(cal.taps)) : null;
        s.markedWithRider = cal ? true : null;
      }
      if (!('bikeMeasures' in s)) s.bikeMeasures = null;
      if (!('secondClip' in s)) s.secondClip = null;
      if (!Array.isArray(s.replies)) s.replies = [];
    }
  }
  if (schema < TF_CONFIG.app.schemaVersion) obj.schema = TF_CONFIG.app.schemaVersion;
  return obj;
}

/** Merge incoming into current: riders matched by id; sessions matched by id, newest wins; unmatched added. */
function mergeFiles(current, incoming) {
  const out = JSON.parse(JSON.stringify(current));
  let ridersAdded = 0, sessionsAdded = 0, sessionsUpdated = 0;
  for (const ri of incoming.riders) {
    const rc = out.riders.find((r) => r.id === ri.id);
    if (!rc) { out.riders.push(JSON.parse(JSON.stringify(ri))); ridersAdded++; sessionsAdded += ri.sessions.length; continue; }
    if ((ri.modified || '') > (rc.modified || '')) { rc.name = ri.name; rc.profile = ri.profile; rc.bike = ri.bike; rc.modified = ri.modified; }
    for (const si of ri.sessions) {
      const k = rc.sessions.findIndex((s) => s.id === si.id);
      if (k < 0) { rc.sessions.push(JSON.parse(JSON.stringify(si))); sessionsAdded++; }
      else if ((si.modified || '') > (rc.sessions[k].modified || '')) { rc.sessions[k] = JSON.parse(JSON.stringify(si)); sessionsUpdated++; }
    }
    rc.sessions.sort((a, b) => (a.created < b.created ? -1 : 1));
  }
  // Unknown top-level fields from the incoming file are kept if the current file lacks them.
  for (const [k, v] of Object.entries(incoming)) if (!(k in out)) out[k] = v;
  out.modified = new Date().toISOString();
  return { file: out, ridersAdded, sessionsAdded, sessionsUpdated };
}

/** Paths inside the .tango zip. */
const PATHS = {
  manifest: 'manifest.json',
  rider: (r) => `riders/${r}/rider.json`,
  session: (r, s) => `riders/${r}/sessions/${s}/session.json`,
  clip: (r, s, c, ext) => `riders/${r}/sessions/${s}/clips/${c}.${ext}`,
  snapshot: (r, s, n) => `riders/${r}/sessions/${s}/snapshots/${n}.png`,
  report: (r, s, n) => `riders/${r}/sessions/${s}/reports/${n}.pdf`,
};

/* ==========================================================================
   Synthetic rider — a forward-kinematic model used for the sample fit and for tests.
   Builds pose frames exactly as the detector would report them.
   ========================================================================== */
function simulateRider(p) {
  p = Object.assign({
    W: 1280, H: 720, fps: 30, seconds: 12, cadence: 85, facing: 1, side: 'left',
    pxPerMm: 0.36, bbPx: { x: 560, y: 540 },
    crank: 172.5, thigh: 470, shin: 450,
    seatAngleDeg: 73.5, saddleToHip: 0,   // hip lies on the effective seat tube line
    hipFromBB: null,                      // mm along the seat tube; computed if null
    targetKneeExt: 145, saddleOffsetMm: 0, setbackOffsetMm: 0,
    backDeg: 47, torso: 560, upperArm: 300, forearm: 270, handReach: null,
    ankleBase: 102, ankleSwing: 9,         // knee–ankle–toe angle (deg) and its swing through the stroke
    noisePx: 1.2, wheel: '700x28', seed: 7,
  }, p || {});
  let s = p.seed;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const R = Math.PI / 180;
  const seatU = { x: -Math.cos(p.seatAngleDeg * R), y: Math.sin(p.seatAngleDeg * R) };
  // Foot geometry relative to the spindle in the foot's frame (mm): x along the foot, y up.
  const footPts = { ankle: { x: -125, y: 85 }, heel: { x: -175, y: 35 }, toe: { x: 70, y: 10 } };
  const rot = (v, a) => ({ x: v.x * Math.cos(a) - v.y * Math.sin(a), y: v.x * Math.sin(a) + v.y * Math.cos(a) });
  const footWithPitch = (phi, pitch) => {
    const spindle = { x: p.crank * Math.cos(phi), y: p.crank * Math.sin(phi) };
    const o = {};
    for (const [k, v] of Object.entries(footPts)) o[k] = add(spindle, rot(v, pitch));
    o.spindle = spindle;
    return o;
  };
  // Real riders hold the ankle (shin-to-foot) angle within a narrow band, so the foot's pitch
  // follows the shin. Solve for the pitch that gives the wanted ankle angle at this crank angle.
  let hipForFoot = null;
  const footAt = (phi) => {
    const want = p.ankleBase - p.ankleSwing * Math.sin(phi); // knee–ankle–toe angle, deg: toes down at the bottom
    let pitch = -20 * R;
    if (!hipForFoot) return footWithPitch(phi, pitch);
    for (let it = 0; it < 6; it++) {
      const f = footWithPitch(phi, pitch);
      const kn = solveKnee(hipForFoot, f.ankle, p.thigh, p.shin);
      if (!kn) break;
      const err = angleAt(kn, f.ankle, f.toe) - want;
      pitch += err * R * 0.9; // turning the toe up closes the ankle angle
    }
    return footWithPitch(phi, pitch);
  };
  // Place the hip so knee extension at the bottom equals targetKneeExt (before offsets).
  let hipDist = p.hipFromBB;
  if (hipDist == null) {
    const kneeAt = (dd) => {
      let best = -Infinity;
      const h = scale(seatU, dd);
      hipForFoot = h;
      for (let a = -150; a <= -30; a += 2) {
        const f = footAt(a * R);
        const kn = solveKnee(h, f.ankle, p.thigh, p.shin); if (!kn) return 180;
        best = Math.max(best, angleAt(h, kn, f.ankle));
      }
      return best;
    };
    hipDist = solveMonotone(kneeAt, p.targetKneeExt, 600, 950);
  }
  const hip = add(scale(seatU, hipDist + p.saddleOffsetMm), { x: -p.setbackOffsetMm, y: 0 });
  hipForFoot = hip;
  const shoulderFrom = (h) => add(h, { x: p.torso * Math.cos(p.backDeg * R), y: p.torso * Math.sin(p.backDeg * R) });
  const shoulder = shoulderFrom(hip);
  // Hands: on the bar. The bar is placed for the unmoved saddle, so moving the saddle leaves the bar where it is
  // (as on a real bike) and the arms reach for it.
  const reach = p.handReach || (p.upperArm + p.forearm) * 0.975;
  const handDir = p.handAngleDeg != null ? { x: Math.cos(p.handAngleDeg * R), y: Math.sin(p.handAngleDeg * R) } : norm({ x: 0.92, y: -0.55 });
  const baseWrist = add(shoulderFrom(scale(seatU, hipDist)), scale(handDir, reach));
  let wrist = baseWrist;
  let elbowSol = circleIntersect(shoulder, p.upperArm, wrist, p.forearm);
  if (!elbowSol) { wrist = add(shoulder, scale(handDir, reach)); elbowSol = circleIntersect(shoulder, p.upperArm, wrist, p.forearm); }
  const elbow = elbowSol ? (elbowSol[0].y < elbowSol[1].y ? elbowSol[0] : elbowSol[1]) : add(shoulder, scale(handDir, p.upperArm));
  // Bike points that move with the saddle and the bar (2.0 marks).
  const saddleNose = add(hip, { x: 140, y: -95 });
  const barTop = add(baseWrist, { x: 45, y: -10 });
  const index = add(wrist, scale(norm({ x: 1, y: -0.2 }), 85));
  const nose = add(shoulder, { x: 120, y: 190 });

  const wheelD = WHEELS[p.wheel].bsd + 2 * WHEELS[p.wheel].tyre;
  const rearAxle = { x: -410, y: 70 }, frontAxle = { x: 590, y: 70 };
  const bike = { rearAxle, frontAxle, tyreTop: add(rearAxle, { x: 0, y: wheelD / 2 }), tyreBack: add(rearAxle, { x: -wheelD / 2, y: 0 }), bb: { x: 0, y: 0 } };
  const img = (w) => toImage(w, p.bbPx, p.facing, p.pxPerMm);

  const frames = [];
  const n = Math.round(p.seconds * p.fps);
  const omega = -2 * Math.PI * p.cadence / 60; // clockwise
  const truth = [];
  for (let i = 0; i < n; i++) {
    const t = i / p.fps;
    const phi = Math.PI / 3 + omega * t;
    const near = footAt(phi), far = footAt(phi + Math.PI);
    const kN = solveKnee(hip, near.ankle, p.thigh, p.shin), kF = solveKnee(hip, far.ankle, p.thigh, p.shin);
    const lm = new Array(33).fill(null).map(() => [0.5, 0.5, 0.05]);
    const put = (index, w, vis) => { const q = img(w); lm[index] = [(q.x + gauss() * p.noisePx) / p.W, (q.y + gauss() * p.noisePx) / p.H, vis]; };
    const nearIdx = LM[p.side], farIdx = LM[p.side === 'left' ? 'right' : 'left'];
    put(LM.nose, nose, 0.95);
    put(nearIdx.shoulder, shoulder, 0.97); put(farIdx.shoulder, add(shoulder, { x: 8, y: 4 }), 0.55);
    put(nearIdx.elbow, elbow, 0.93); put(farIdx.elbow, add(elbow, { x: 6, y: 3 }), 0.45);
    put(nearIdx.wrist, wrist, 0.9); put(farIdx.wrist, add(wrist, { x: 5, y: 2 }), 0.4);
    put(nearIdx.index, index, 0.85); put(farIdx.index, add(index, { x: 5, y: 2 }), 0.35);
    put(nearIdx.hip, hip, 0.96); put(farIdx.hip, add(hip, { x: 6, y: 2 }), 0.6);
    put(nearIdx.knee, kN, 0.95); put(farIdx.knee, kF, 0.5);
    put(nearIdx.ankle, near.ankle, 0.93); put(farIdx.ankle, far.ankle, 0.45);
    put(nearIdx.heel, near.heel, 0.9); put(farIdx.heel, far.heel, 0.4);

<script>
/* ==========================================================================
   Tango Fitter brand (chosen design: rider silhouette with orange joint markers,
   a measured hip angle and a light grey bike; "Tango" in ink, "Fitter" in orange).
   Drawn on the app's own rider model so the joints sit where real joints do.

   Three forms, as with any detailed mark:
   - logoFullSVG:  rider, bike, measured angle. Welcome screen and report.
   - logoMarkSVG:  rider and joints only. Header and small places.
   - logoIconSVG:  the mark on a navy tile. Home-screen icon and favicon.
   ========================================================================== */
const BRAND = {
  orange: '#FF6A1A',
  navy: '#0A1220',
  // Joint positions (px) from the model rider with the near pedal at the 2 o'clock power position.
  j: {
    head: { x: 652, y: 70 }, shoulder: { x: 634.2, y: 130.1 }, elbow: { x: 713.1, y: 203.8 }, wrist: { x: 805.9, y: 232.8 },
    hip: { x: 475.3, y: 254.2 }, knee: { x: 629.2, y: 324.6 }, ankle: { x: 574.7, y: 477.1 }, heel: { x: 556, y: 494 }, toe: { x: 641, y: 511 },
  },
  bike: { rear: { x: 412.4, y: 514.8 }, front: { x: 772.4, y: 514.8 }, r: 122, bb: { x: 560, y: 540 }, spindle: { x: 612, y: 505 },
    seat: { x: 468, y: 302 }, saddle: { x: 478, y: 286 }, headTop: { x: 746, y: 262 }, headBot: { x: 762, y: 322 },
    // 2.0 marks: the saddle's front tip and the top of the hood where the hand rests.
    saddleNose: { x: 514, y: 288 }, barTop: { x: 812, y: 232 } },
};

/** Pictogram rider: even, rounded strokes, head set apart from the body. */
function riderSilhouette(ink) {
  const j = BRAND.j;
  const pl = (pts) => pts.map((p) => `${p.x},${p.y}`).join(' ');
  return `<g fill="none" stroke="${ink}" stroke-linecap="round" stroke-linejoin="round">
    <line x1="${j.hip.x}" y1="${j.hip.y}" x2="${j.shoulder.x}" y2="${j.shoulder.y}" stroke-width="70"/>
    <polyline points="${pl([j.hip, j.knee, j.ankle])}" stroke-width="54"/>
    <polyline points="${pl([j.heel, j.toe])}" stroke-width="28"/>
    <polyline points="${pl([j.shoulder, j.elbow, j.wrist])}" stroke-width="34"/>
  </g><circle cx="${j.head.x}" cy="${j.head.y}" r="38" fill="${ink}"/>`;
}

/** Orange measurement overlay: bones and joint rings (and, for the full logo, the measured hip angle). */
function jointOverlay(ringFill, withAngle, ink) {
  const j = BRAND.j, o = BRAND.orange;
  const pts = [j.shoulder, j.hip, j.knee, j.ankle];
  const bones = `<polyline points="${pts.map((p) => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="${o}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`
    + `<line x1="${j.shoulder.x}" y1="${j.shoulder.y}" x2="${j.elbow.x}" y2="${j.elbow.y}" stroke="${o}" stroke-width="6" stroke-linecap="round" opacity=".9"/>`;
  const rings = [j.shoulder, j.hip, j.knee, j.ankle].map((p) => `<circle cx="${p.x}" cy="${p.y}" r="17" fill="${ringFill}" stroke="${o}" stroke-width="8"/>`).join('')
    + `<circle cx="${j.elbow.x}" cy="${j.elbow.y}" r="12" fill="${ringFill}" stroke="${o}" stroke-width="6"/>`;
  let angle = '';
  if (withAngle) {
    const hp = j.hip, r = 92;
    const a1 = -Math.PI / 2; // straight up
    const a2 = Math.atan2(j.shoulder.y - hp.y, j.shoulder.x - hp.x);
    const p1 = { x: hp.x + r * Math.cos(a1), y: hp.y + r * Math.sin(a1) }, p2 = { x: hp.x + r * Math.cos(a2), y: hp.y + r * Math.sin(a2) };
    angle = `<g stroke="${ink}" stroke-width="5" stroke-dasharray="14 11" opacity=".55" fill="none">
        <line x1="${hp.x}" y1="${hp.y - 140}" x2="${hp.x}" y2="${hp.y + 70}"/><line x1="${hp.x - 150}" y1="${hp.y}" x2="${hp.x - 24}" y2="${hp.y}"/></g>
      <path d="M${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A${r} ${r} 0 0 1 ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}" fill="none" stroke="${o}" stroke-width="8" stroke-linecap="round"/>
      <circle cx="${hp.x - 150}" cy="${hp.y}" r="11" fill="${ringFill}" stroke="${o}" stroke-width="6"/>`;
  }
  return angle + bones + rings;
}

function bikeLines(stroke) {
  const b = BRAND.bike, j = BRAND.j;
  const L = (a, c) => `<line x1="${a.x}" y1="${a.y}" x2="${c.x}" y2="${c.y}"/>`;
  return `<g fill="none" stroke="${stroke}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="${b.rear.x}" cy="${b.rear.y}" r="${b.r}"/><circle cx="${b.front.x}" cy="${b.front.y}" r="${b.r}"/>
    ${L(b.rear, b.bb)}${L(b.rear, b.seat)}${L(b.bb, b.seat)}${L(b.seat, b.headTop)}${L(b.bb, b.headBot)}${L(b.headTop, b.headBot)}${L(b.headBot, b.front)}
    ${L(b.seat, b.saddle)}<line x1="${b.saddle.x - 42}" y1="${b.saddle.y}" x2="${b.saddle.x + 36}" y2="${b.saddle.y + 2}" stroke-width="16"/>
    ${L(b.headTop, { x: j.wrist.x + 10, y: j.wrist.y + 4 })}
    <circle cx="${b.bb.x}" cy="${b.bb.y}" r="30" stroke-width="9"/>
    <line x1="${b.bb.x}" y1="${b.bb.y}" x2="${b.spindle.x}" y2="${b.spindle.y}" stroke-width="14"/>
  </g>`;
}

/** The full logo: rider, bike and measured hip angle. */
function logoFullSVG(width, opts) {
  const o = Object.assign({ ink: 'currentColor', bike: 'var(--logo-bike, #A9B6C9)', bg: 'var(--bg-2, #fff)', title: 'Tango Fitter' }, opts || {});
  return `<svg viewBox="252 10 652 652" width="${width}" height="${width}" role="img" aria-label="${o.title}" class="logo-full">
    ${bikeLines(o.bike)}${riderSilhouette(o.ink)}${jointOverlay(o.bg, true, o.ink)}</svg>`;
}

/** The mark: rider, joints and bike (no measuring guides), cropped square. */
function markInner(ink, ringFill, bike) { return bikeLines(bike) + riderSilhouette(ink) + jointOverlay(ringFill, false, ink); }
function logoMarkSVG(size, opts) {
  const o = Object.assign({ ink: 'currentColor', bike: 'var(--logo-bike, #8D9AB0)', bg: 'var(--bg, #0A1220)', title: 'Tango Fitter' }, opts || {});
  return `<svg viewBox="282 24 632 632" width="${size}" height="${size}" role="img" aria-label="${o.title}" class="mark">${markInner(o.ink, o.bg, o.bike)}</svg>`;
}

/** App icon: the mark on a navy rounded tile. */
function logoIconSVG(size, radius) {
  const r = radius == null ? 132 : radius;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="${size}" height="${size}">
    <rect width="600" height="600" rx="${r}" fill="${BRAND.navy}"/>
    <g transform="translate(300 306) scale(.8) translate(-598 -340)">${markInner('#E9EEF6', BRAND.navy, '#4A5C7C')}</g></svg>`;
}

/** Mark + wordmark: "Tango" in ink, "Fitter" in orange. */
function logoLockupHTML(height) {
  const h = height || 28;
  return `<span class="lockup" style="--h:${h}px">${logoMarkSVG(h)}<span class="wordmark"><b>Tango</b><span>Fitter</span></span></span>`;
}

if (typeof module !== 'undefined' && module.exports) module.exports = { BRAND, logoFullSVG, logoMarkSVG, logoIconSVG, logoLockupHTML };

</script>

/* ---------- lazy libraries ---------- */
const scriptPromises = {};
function loadScript(url) {
  if (scriptPromises[url]) return scriptPromises[url];
  scriptPromises[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = () => { delete scriptPromises[url]; rej(new Error(`Could not load ${url.split('/').slice(-1)[0]}. Check the internet connection.`)); };
    document.head.appendChild(s);
  });
  return scriptPromises[url];
}
async function getJSZip() { if (!window.JSZip) await loadScript(C.libraries.jszip); return window.JSZip; }

/* ---------- pose detection ----------
   loadPose('lite' | 'heavy', onProgress) → { detect(source, tsMs) → compact landmarks | null, close() }
   The model is downloaded once with progress and kept in Cache Storage, so later runs work offline.
   A test hook (window.__TF_FAKE_POSE) replaces the detector for automated browser tests. */
let visionPromise = null;
async function vision() {
  if (!visionPromise) {
    visionPromise = (async () => {
      const mod = await import(C.libraries.visionBundle);
      const fileset = await mod.FilesetResolver.forVisionTasks(C.libraries.visionWasm);
      return { mod, fileset };
    })().catch((e) => { visionPromise = null; throw e; });
  }
  return visionPromise;
}
async function fetchModel(url, onProgress) {
  let cache = null;
  try { cache = await caches.open('tango-models-v1'); const hit = await cache.match(url); if (hit) { onProgress && onProgress(1, true); return new Uint8Array(await hit.arrayBuffer()); } } catch { /* no Cache Storage */ }
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Model download failed (${res.status}).`);
  const total = Number(res.headers.get('content-length')) || 0;
  const reader = res.body.getReader(); const chunks = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (onProgress && total) onProgress(got / total, false); }
  const buf = new Uint8Array(got); let o = 0; for (const c of chunks) { buf.set(c, o); o += c.length; }
  try { if (cache) await cache.put(url, new Response(buf, { headers: { 'content-type': 'application/octet-stream' } })); } catch { /* quota */ }
  onProgress && onProgress(1, false);
  return buf;
}
async function loadPose(kind, onProgress) {
  if (window.__TF_FAKE_POSE) {
    onProgress && onProgress(1, true);
    return { kind, fake: true, detect: (src, ts) => window.__TF_FAKE_POSE(kind, src, ts), close() {} };
  }
  const { mod, fileset } = await vision();
  const buf = await fetchModel(kind === 'heavy' ? C.libraries.poseHeavy : C.libraries.poseLite, onProgress);
  const make = (delegate) => mod.PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetBuffer: buf, delegate }, runningMode: 'VIDEO', numPoses: 1,
    minPoseDetectionConfidence: C.pose.minDetectionConfidence, minPosePresenceConfidence: C.pose.minPresenceConfidence, minTrackingConfidence: C.pose.minTrackingConfidence,
  });
  let lm;
  try { lm = await make(C.pose.delegate); } catch (e) { console.warn('GPU delegate failed, using CPU', e); lm = await make('CPU'); }
  let lastTs = -1;
  return {
    kind,
    detect(source, tsMs) {
      const ts = Math.max(lastTs + 1, Math.round(tsMs)); lastTs = ts;
      const r = lm.detectForVideo(source, ts);
      const p = r && r.landmarks && r.landmarks[0];
      return p ? TF.compactLandmarks(p) : null;
    },
    close() { try { lm.close(); } catch { /* already closed */ } },
  };
}

/* ---------- audio guidance: voice and beeps ---------- */
const Sound = {
  ctx: null, voice: null, unlocked: false,
  unlock() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      // A silent blip inside the tap so iOS allows sound later.
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(); g.gain.value = 0.0001; o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.02);
    } catch { /* no Web Audio */ }
    try {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u);
        const pick = () => { const vs = speechSynthesis.getVoices(); this.voice = vs.find((v) => /en[-_](US|GB)/i.test(v.lang) && /Samantha|Daniel|Google|Natural|Enhanced|Premium/i.test(v.name)) || vs.find((v) => /^en/i.test(v.lang)) || null; };
        pick(); speechSynthesis.onvoiceschanged = pick;
      }
    } catch { /* no speech */ }
    this.unlocked = true;
  },
  wantsVoice() { return Settings.v.audioMode !== 'beeps'; },
  wantsBeeps() { return Settings.v.audioMode !== 'voice'; },
  say(text, opts) {
    const o = opts || {};
    Sound.lastSaid = text;
    if (!this.wantsVoice() || !('speechSynthesis' in window)) return Promise.resolve();
    if (o.interrupt !== false) speechSynthesis.cancel();
    return new Promise((res) => {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = C.audio.rate; u.volume = C.audio.volume; if (this.voice) u.voice = this.voice;
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 85);
      speechSynthesis.speak(u);
    });
  },
  tone(freq, ms, vol) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.25, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
    } catch { /* ignore */ }
  },
  // Beep meanings (shown in the on-screen legend): short = countdown, long high = recording started,
  // two high = recording finished, low double = problem.
  beep(kind) {
    if (!this.wantsBeeps()) return;
    const A = C.audio;
    if (kind === 'count') this.tone(A.beepHz, A.beepMs);
    else if (kind === 'start') this.tone(A.beepHighHz, 420, 0.3);
    else if (kind === 'stop') { this.tone(A.beepHighHz, 160); setTimeout(() => this.tone(A.beepHighHz, 160), 220); }
    else if (kind === 'problem') { this.tone(330, 180); setTimeout(() => this.tone(330, 180), 240); }
    else if (kind === 'tick') this.tone(A.tickHz, A.tickMs, 0.12);
  },
  stop() { try { speechSynthesis.cancel(); } catch { /* ignore */ } },
};
const BEEP_LEGEND = [
  ['Short beeps', 'counting down to the recording'],
  ['One long high beep', 'recording has started'],
  ['Soft ticks', 'pedal strokes being counted'],
  ['Two high beeps', 'recording finished'],
  ['Two low beeps', 'a problem: listen or look at the screen'],
];

/** sheet({ title, body (html), actions: [{ label, value, kind }] , onOpen }) → Promise<value | null> */
function sheet(opts) {

    const scrim = el(`<div class="scrim" role="dialog" aria-modal="true"><div class="sheet"><h2>${esc(opts.title || '')}</h2><div class="sheet-body"></div><div class="sheet-actions"></div></div></div>`);

/* ---------- compatibility (brief 2.1) ---------- */
function compatibility() {
  const caps = {
    secure: window.isSecureContext,
    camera: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    recorder: typeof window.MediaRecorder === 'function',
    storage: 'indexedDB' in window,
    wasm: typeof WebAssembly === 'object',
    speech: 'speechSynthesis' in window,
    share: typeof navigator.share === 'function',
  };
  const ua = navigator.userAgent;
  const ios = /iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const iosV = (ua.match(/OS (\d+)_/) || [])[1];
  const chromeV = (ua.match(/(?:Chrome|CriOS)\/(\d+)/) || [])[1];
  const safariV = (ua.match(/Version\/(\d+)/) || [])[1];
  const old = (ios && iosV && Number(iosV) < C.compatibility.minIOS) || (!ios && chromeV && Number(chromeV) < C.compatibility.minChrome) || (!chromeV && safariV && Number(safariV) < C.compatibility.minSafari);
  caps.canRecord = caps.secure && caps.camera && caps.recorder && caps.wasm;
  caps.canRun = caps.storage && !old;
  caps.ios = ios; caps.old = !!old;
  caps.standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  return caps;
}

}

/** Every blob path a session refers to. */
function sessionBlobPaths(s) {
  return [...s.clips.map((c) => c.file), ...s.snapshots.map((x) => x.file), ...s.reports.map((x) => x.file)].filter(Boolean);
}

async function estimateSizes() {
  let json = 0, video = 0, other = 0;
  for (const r of S.file.riders) {
    json += JSON.stringify(r).length;
    for (const s of r.sessions) {
      for (const c of s.clips) if (c.file) { const b = await getBlob(c.file); if (b) video += b.size; }
      for (const x of [...s.snapshots, ...s.reports]) if (x.file) { const b = await getBlob(x.file); if (b) other += b.size; }
    }
  }
  return { full: json + video + other, lite: json + other, video };
}
const mb = (bytes) => (bytes < 1e6 ? `${Math.max(1, Math.round(bytes / 1e3))} KB` : `${(bytes / 1e6).toFixed(bytes < 1e7 ? 1 : 0)} MB`);

async function buildZip(mode) {
  const JSZip = await getJSZip();
  const zip = new JSZip();
  const f = S.file, now = new Date().toISOString();
  const manifest = Object.assign({}, f, { riders: f.riders.map((r) => ({ id: r.id, name: r.name })), exported: now, exportMode: mode, appVersion: C.app.version });
  zip.file(TF.PATHS.manifest, JSON.stringify(manifest, null, 1));
  for (const r of f.riders) {
    zip.file(TF.PATHS.rider(r.id), JSON.stringify(Object.assign({}, r, { sessions: r.sessions.map((s) => s.id) }), null, 1));
    for (const s of r.sessions) {
      const sOut = JSON.parse(JSON.stringify(s));
      if (mode === 'lite') for (const c of sOut.clips) { if (c.file) { c.videoOmitted = true; } }
      zip.file(TF.PATHS.session(r.id, s.id), JSON.stringify(sOut));
      const paths = mode === 'full' ? sessionBlobPaths(s) : sessionBlobPaths(s).filter((p) => !/\/clips\//.test(p));
      for (const p of paths) { const b = await getBlob(p); if (b) zip.file(p, b, { compression: 'STORE' }); }
    }
  }
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 }, mimeType: 'application/octet-stream' });
}

/** Hand a file to the user: the share sheet where it can take files (iOS → Files/iCloud), otherwise a download. */
async function deliverFile(blob, name, type) {
  const file = new File([blob], name, { type: type || blob.type || 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}

/** Read a .tango file into { file, blobs: Map(path → Blob) }. */
async function readTango(blobIn) {
  const JSZip = await getJSZip();
  let zip;
  try { zip = await JSZip.loadAsync(blobIn); } catch { throw new Error('This is not a Tango Fitter file (it is not a .tango archive).'); }
  const mf = zip.file(TF.PATHS.manifest);
  if (!mf) throw new Error('This is not a Tango Fitter file (no manifest inside).');
  const manifest = JSON.parse(await mf.async('string'));
  const riders = [];
  for (const ref of manifest.riders || []) {
    const rf = zip.file(TF.PATHS.rider(ref.id));
    if (!rf) continue;
    const r = JSON.parse(await rf.async('string'));
    const sessions = [];
    for (const sid of r.sessions || []) {
      const sf = zip.file(TF.PATHS.session(r.id, sid));
      if (sf) sessions.push(JSON.parse(await sf.async('string')));
    }
    r.sessions = sessions;
    riders.push(r);
  }
  const fileObj = Object.assign({}, manifest, { riders });
  delete fileObj.exported; delete fileObj.exportMode;
  TF.migrateFile(fileObj);
  const blobs = new Map();
  for (const r of riders) for (const s of r.sessions) for (const p of sessionBlobPaths(s)) {
    const z = zip.file(p);
    if (z) { const type = /\.png$/.test(p) ? 'image/png' : /\.pdf$/.test(p) ? 'application/pdf' : (s.clips.find((c) => c.file === p) || {}).mime || 'video/mp4'; blobs.set(p, new Blob([await z.async('arraybuffer')], { type })); }
  }
  return { file: fileObj, blobs };
}

function pickFile() {
  return new Promise((resolve) => {
    // No accept filter: iOS greys out files whose type it does not know, and .tango is ours.
    const input = el('<input type="file" style="display:none">');
    input.onchange = () => { resolve(input.files[0] || null); input.remove(); };
    document.body.appendChild(input); input.click();
  });
}

async function openFileFlow(preFile) {
  const f = preFile || await pickFile();
  if (!f) return;
  let data;
  try { toast('Opening…', 1500); data = await readTango(f); } catch (e) { await sheet({ title: 'Could not open the file', body: `<p class="muted">${esc(e.message)}</p>`, actions: [{ label: 'OK', value: true, kind: 'primary' }] }); return; }
  const inc = data.file;
  const nS = inc.riders.reduce((n, r) => n + r.sessions.length, 0);
  let mode = 'replace';
  if (S.file) {
    mode = await sheet({
      title: `Open “${esc(inc.name)}”`,
      body: `<p class="muted">It holds ${plural(inc.riders.length, 'rider')} and ${plural(nS, 'session')}.</p>
        <p class="muted" style="margin-top:8px"><b>Replace</b> closes “${esc(S.file.name)}” and opens this one${unexported() ? ' — the current file has changes that have not been exported, which would be lost' : ''}. <b>Merge</b> adds this file's riders and sessions to the current file (the newer copy of any session wins).</p>`,
      actions: [{ label: 'Cancel', value: null, kind: 'quiet' }, { label: 'Merge', value: 'merge' }, { label: 'Replace', value: 'replace', kind: unexported() ? 'danger' : 'primary' }],
    });
    if (!mode) return;
  }
  if (mode === 'replace') {
    await DB.clear('blobs');
    for (const [p, b] of data.blobs) await putBlob(p, b);
    S.file = inc; S.riderId = inc.riders[0] ? inc.riders[0].id : null; S.cache.clear();
    S.meta.lastExportedAt = inc.modified; // what is open now is exactly what is in the file
    await saveFile(false);
    toast(`Opened “${esc(inc.name)}”: ${plural(inc.riders.length, 'rider')}, ${plural(nS, 'session')}.`);
  } else {
    const m = TF.mergeFiles(S.file, inc);
    // Copy the blobs of every session that came from the incoming file.
    for (const r of m.file.riders) for (const s of r.sessions) {
      const src = inc.riders.flatMap((x) => x.sessions).find((x) => x.id === s.id && x.modified === s.modified);
      if (src) for (const p of sessionBlobPaths(src)) if (data.blobs.has(p)) await putBlob(p, data.blobs.get(p));
    }
    S.file = m.file; S.cache.clear();
    await saveFile(true);
    toast(`Merged: ${plural(m.ridersAdded, 'rider')} and ${plural(m.sessionsAdded, 'session')} added, ${plural(m.sessionsUpdated, 'session')} updated.`, 5000);
  }
  go('#/');
}

async function newFileFlow() {
  if (S.file && unexported()) {
    const v = await sheet({ title: 'Start a new fit file?', body: '<p class="muted">The open file has changes that have not been exported. Starting a new file closes it, and those changes would be lost.</p>',
      actions: [{ label: 'Cancel', value: null, kind: 'quiet' }, { label: 'Export first', value: 'export' }, { label: 'Discard and start new', value: 'new', kind: 'danger' }] });
    if (!v) return;
    if (v === 'export') { await exportFlow(); return; }
  }
  const name = await promptText('New fit file', 'File name', S.file ? 'My fits' : 'My fits', 'A fit file can hold several riders, for example a household.');
  if (!name) return;
  await DB.clear('blobs');
  S.file = TF.newFitFile(name); S.riderId = null; S.cache.clear(); S.meta.lastExportedAt = null;
  await saveFile();
  go('#/rider/new');
}

/** A sample fit built from the synthetic rider, so the app can be explored without a camera. */
async function createSampleFile() {
  S.file = TF.newFitFile('Sample fit'); S.cache.clear();
  const r = TF.newRider('Sample rider');
  r.profile = Object.assign(r.profile, { bikeType: 'road', goal: 'endurance', hands: ['hoods', 'drops'], flexibility: 'nearly' });
  r.bike = Object.assign(r.bike, { name: 'Sample road bike', crankLength: 172.5, wheel: '700x28' });
  S.file.riders.push(r); S.riderId = r.id;
  const s = TF.newSession(r);
  s.sample = true;
  s.created = s.modified = new Date(Date.now() - 3600e3).toISOString();
  s.discomfort = { regions: { kneeFront: { level: 'mild', pattern: 'builds' } }, numbness: false, recentInjury: false };
  // A realistic road position (hoods about 60 mm below the saddle nose), marked on the empty bike.
  const sim = TF.simulateRider({ saddleOffsetMm: -13, seconds: 14, seed: 11, torso: 480, backDeg: 40, handAngleDeg: -48, upperArm: 340, forearm: 300 });
  const cal = TF.computeCalibration(sim.marks, r.bike, sim.height, sim.width); cal.markedWithRider = false;
  const clip = { id: TF.uid('c'), view: 'side', hand: 'hoods', mime: null, file: null, width: sim.width, height: sim.height, fps: 30, analysedFps: 30, durationS: sim.frames[sim.frames.length - 1].t, calibration: cal, frames: sim.frames, live: { strokes: 19, cadence: 85 }, captureSettings: {}, sample: true };
  s.clips.push(clip);
  s.marks = JSON.parse(JSON.stringify(sim.marks)); s.bikeMeasures = cal.bikeMeasures; s.markedWithRider = false;
  const a = TF.analyseClip(clip);
  clip.calibration = a.calibration || cal;
  s.results = TF.buildResults(a, s.profile, clip.hand, s.discomfort, Settings.v.units);
  s.results.cadence = a.cadence; s.results.strokes = a.strokes.length;
  r.sessions.push(s);
  S.meta.lastExportedAt = null;
  await DB.clear('blobs');
  await saveFile();
  return s;
}

/* ---- app-art.js ---- */
/* ==========================================================================
   Illustrations, drawn in the logo's language (pictogram rider, grey bike,
   orange joints) on the same geometry as the logo, so the brand and every
   picture in the app are one design. Pure SVG, theme-aware via CSS variables.
   ========================================================================== */
const ART = (() => {
  const b = BRAND.bike, j = BRAND.j;
  const pts = {
    rearAxle: b.rear, frontAxle: b.front, bb: b.bb, spindle: { x: b.bb.x + 56, y: b.bb.y },
    tyreTop: { x: b.rear.x, y: b.rear.y - b.r - 6 }, tyreBack: { x: b.rear.x - b.r - 6, y: b.rear.y },
    saddleNose: b.saddleNose, barTop: b.barTop,
  };
  return { b, j, pts, groundY: b.rear.y + b.r + 8 };
})();

function angleArc(c, p1, p2, r) {
  const a1 = Math.atan2(p1.y - c.y, p1.x - c.x), a2 = Math.atan2(p2.y - c.y, p2.x - c.x);
  let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const q1 = { x: c.x + r * Math.cos(a1), y: c.y + r * Math.sin(a1) }, q2 = { x: c.x + r * Math.cos(a1 + d), y: c.y + r * Math.sin(a1 + d) };
  return `M${q1.x.toFixed(1)} ${q1.y.toFixed(1)} A${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${q2.x.toFixed(1)} ${q2.y.toFixed(1)}`;
}

/**
 * riderSVG(opts) — side view in the brand style.
 * opts: { rider: true, angles: false (arcs + degree labels), highlight: tap key, extra: svg string, view: [x,y,w,h], label }
 */
function riderSVG(opts) {
  const o = Object.assign({ rider: true, angles: false }, opts || {});
  const { j, pts } = ART;
  const view = o.view || [250, 0, 680, 680];
  let body = `<line x1="${view[0] + 10}" y1="${ART.groundY}" x2="${view[0] + view[2] - 10}" y2="${ART.groundY}" stroke="var(--line-2)" stroke-width="6" stroke-linecap="round"/>`;
  body += bikeLines('var(--logo-bike)');
  if (o.rider) body += riderSilhouette('var(--ink)') + jointOverlay('var(--bg-2)', false, 'var(--ink)');
  if (o.angles) {
    const lab = (x, y, t) => `<g><rect x="${x - 8}" y="${y - 34}" width="${t.length * 21 + 16}" height="46" rx="10" fill="var(--bg-2)" stroke="var(--line-2)" stroke-width="2"/><text x="${x}" y="${y}" style="fill:var(--ink);font:700 34px var(--font)">${t}</text></g>`;
    const k = Math.round(TF.angleAt(j.hip, j.knee, j.ankle)), h = Math.round(TF.angleAt(j.shoulder, j.hip, j.knee)), e = Math.round(TF.angleAt(j.shoulder, j.elbow, j.wrist));
    body += `<g fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"><path d="${angleArc(j.knee, j.hip, j.ankle, 52)}"/><path d="${angleArc(j.hip, j.shoulder, j.knee, 62)}"/><path d="${angleArc(j.elbow, j.shoulder, j.wrist, 44)}"/></g>`
      + lab(j.knee.x + 40, j.knee.y + 14, `${k}°`) + lab(j.hip.x - 130, j.hip.y + 14, `${h}°`) + lab(j.elbow.x - 20, j.elbow.y + 76, `${e}°`);
  }
  if (o.highlight && pts[o.highlight]) {
    const p = pts[o.highlight];
    body += `<circle cx="${p.x}" cy="${p.y}" r="34" fill="none" stroke="var(--accent)" stroke-width="8"/><circle cx="${p.x}" cy="${p.y}" r="11" fill="var(--accent)"/>`;
  }
  if (o.extra) body += o.extra;
  return `<svg viewBox="${view.join(' ')}" xmlns="http://www.w3.org/2000/svg" class="art" role="img" aria-label="${esc(o.label || 'Rider on a bike, side view')}">${body}</svg>`;
}

/**
 * silhouetteSVG(W, H, flip) — the placement guide, in the video's own pixel coordinates (so it sits exactly on
 * the recorded frame): the brand bike with each wheel 20% of the frame width, the ground at 84% of the height,
 * centred, and the brand rider on it (drawn a little smaller about the bottom bracket so the head fits 16:9).
 * Dashed 35% white for the bike, brighter wheels (what the user lines up), a faint rider. flip mirrors it for a
 * bike facing left.
 */
function silhouetteGeometry(W, H, flip) {
  const b = BRAND.bike, S = TF.CONFIG.camera.silhouette;
  const k = (S.wheelFrac * W) / (2 * b.r);
  const ty = S.groundFrac * H - (b.rear.y + b.r) * k;
  const cx = (b.rear.x + b.front.x) / 2;
  const tx = S.centreXFrac * W - cx * k;
  // Map a brand point to video pixels.
  const map = (p) => { let x = tx + p.x * k; if (flip) x = W - x; return { x, y: ty + p.y * k }; };
  return { k, tx, ty, map, transform: flip ? `translate(${W} 0) scale(-1 1) translate(${tx} ${ty}) scale(${k})` : `translate(${tx} ${ty}) scale(${k})` };
}
function silhouetteSVG(W, H, flip, ghosts) {
  const g = silhouetteGeometry(W, H, flip), b = BRAND.bike, j = BRAND.j, rs = TF.CONFIG.camera.silhouetteRiderScale;
  const L = (a, c) => `<line x1="${a.x}" y1="${a.y}" x2="${c.x}" y2="${c.y}"/>`;
  const sw = 2.5 / g.k; // ~2.5 px on the video whatever the scale
  const riderT = `translate(${b.bb.x} ${b.bb.y}) scale(${rs}) translate(${-b.bb.x} ${-b.bb.y})`;
  const pl = (pts) => pts.map((p) => `${p.x},${p.y}`).join(' ');
  let ghostHTML = '';
  if (ghosts) {
    for (const [key, p] of Object.entries(ghosts)) {
      ghostHTML += `<circle cx="${p.x}" cy="${p.y}" r="${Math.max(10, W / 90)}" fill="none" stroke="#20D6B5" stroke-width="${Math.max(3, W / 400)}"/><circle cx="${p.x}" cy="${p.y}" r="${Math.max(3, W / 400)}" fill="#20D6B5"/>`;
      void key;
    }
  }
  return `<svg class="sil" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="${g.transform}">
      <g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="${sw * 1.6}" stroke-dasharray="${14 / g.k * 0.6} ${10 / g.k * 0.6}" stroke-linecap="round">
        ${L(b.rear, b.bb)}${L(b.rear, b.seat)}${L(b.bb, b.seat)}${L(b.seat, b.headTop)}${L(b.bb, b.headBot)}${L(b.headTop, b.headBot)}${L(b.headBot, b.front)}${L(b.seat, b.saddle)}${L(b.headTop, b.barTop)}
        <line x1="${b.saddle.x - 42}" y1="${b.saddle.y}" x2="${b.saddleNose.x}" y2="${b.saddleNose.y}"/>
      </g>
      <g fill="none" stroke="rgba(255,255,255,.75)" stroke-width="${sw * 2}" stroke-dasharray="${22 / g.k * 0.6} ${9 / g.k * 0.6}">
        <circle cx="${b.rear.x}" cy="${b.rear.y}" r="${b.r}"/><circle cx="${b.front.x}" cy="${b.front.y}" r="${b.r}"/>
      </g>
      <g fill="rgba(255,255,255,.6)"><circle cx="${b.rear.x}" cy="${b.rear.y}" r="${6 / g.k * 0.6}"/><circle cx="${b.front.x}" cy="${b.front.y}" r="${6 / g.k * 0.6}"/><circle cx="${b.bb.x}" cy="${b.bb.y}" r="${7 / g.k * 0.6}"/></g>
      <line x1="${b.rear.x - b.r - 40}" y1="${b.rear.y + b.r}" x2="${b.front.x + b.r + 40}" y2="${b.front.y + b.r}" stroke="rgba(255,255,255,.35)" stroke-width="${sw}"/>
      <g transform="${riderT}" fill="none" stroke="rgba(255,255,255,.16)" stroke-linecap="round" stroke-linejoin="round">
        <line x1="${j.hip.x}" y1="${j.hip.y}" x2="${j.shoulder.x}" y2="${j.shoulder.y}" stroke-width="70"/>
        <polyline points="${pl([j.hip, j.knee, j.ankle])}" stroke-width="54"/>
        <polyline points="${pl([j.heel, j.toe])}" stroke-width="28"/>
        <polyline points="${pl([j.shoulder, j.elbow, j.wrist])}" stroke-width="34"/>
        <circle cx="${j.head.x}" cy="${j.head.y}" r="38" fill="rgba(255,255,255,.16)" stroke="none"/>
      </g>
    </g>
    ${ghostHTML}
  </svg>`;
}

function sessionRow(r, s, showRider) {
  return `<a class="list-item" href="#/session/${s.id}"><span class="grow">${sessionRowInner(r, s, showRider)}</span>${icon('chevR', 'chev')}</a>`;
}
function sessionRowInner(r, s, showRider) {
  const res = sessionResults(r, s);
  const rec = res && res.recommendation && res.recommendation.current;
  const ke = res && res.gauges.find((g) => g.metric === 'kneeExtension');
  const clip = s.clips[0];
  const hand = clip ? TF.HAND_POSITIONS[clip.hand] : '';
  const headline = !res ? 'No results' : rec ? (rec.kind === 'stop' ? 'See a professional' : rec.text.replace(/, then retest\.$/, '')) : 'Saddle position in range';
  return `<span class="title">${esc(fmtDateTime(s.created))}${s.sample ? ' <span class="tag teal">Sample</span>' : ''}${s.retestOf ? ' <span class="tag">Retest</span>' : ''}</span><br>
    <span class="sub">${showRider ? `${esc(r.name)} · ` : ''}${esc(headline)}${hand ? ` · ${esc(hand)}` : ''}${ke && TF.finite(ke.value) ? ` · knee extension ${Math.round(ke.value)}°` : ''}</span>`;
}

/** Results for a session, recomputed from its frames (so units and wording follow current settings). */
function sessionAnalysis(s) {
  if (S.cache.has(s.id)) return S.cache.get(s.id);
  const clip = s.clips[0];
  if (!clip || !clip.frames || !clip.frames.length) return null;
  const a = TF.analyseClip(Object.assign({}, clip, { calibration: clip.calibration ? JSON.parse(JSON.stringify(clip.calibration)) : null }));
  S.cache.set(s.id, a);
  return a;
}
/** The rider's earlier sessions, oldest first, for the same hand position: what each recommended and measured. */
function historyFor(r, s) {
  const hand = (s.clips[0] || {}).hand;
  return r.sessions
    .filter((x) => x.id !== s.id && !x.sample && x.created < (s.created || '9') && x.results && (x.clips[0] || {}).hand === hand)
    .sort((a, b) => (a.created < b.created ? -1 : 1))
    .map((x) => TF.historyEntry(x.results, x.bikeMeasures, x.created));
}
function sessionResults(r, s) {
  const a = sessionAnalysis(s);
  if (!a || !a.ok) return null;
  const res = TF.buildResults(a, s.profile || r.profile, (s.clips[0] || {}).hand, s.discomfort, Settings.v.units, { history: historyFor(r, s), bikeMeasures: s.bikeMeasures });
  res.cadence = a.cadence; res.strokes = a.strokes.length;
  return res;
}

route('/sessions', async (main, { query }) => {

  const row = (x) => selecting
    ? `<label class="list-item pick"><input type="checkbox" data-id="${x.session.id}"><span class="grow">${sessionRowInner(x.rider, x.session, which === 'all')}</span></label>`

    ${selecting ? `<div class="select-bar panel tight"><span class="grow small muted" id="ss-count">Pick two sessions to compare, or any to delete.</span><button class="btn sm" id="ss-compare" disabled>Compare</button><button class="btn sm danger" id="ss-delete" disabled>${icon('trash')}Delete</button></div>` : ''}
    ${items.length ? `<div class="list">${items.map(row).join('')}</div>`

  $$('#ss-riders .chip', main).forEach((b) => (b.onclick = async () => {

    else { S.meta.sessionsRider = 'one'; S.riderId = b.dataset.r; renderShell('sessions'); }
    await saveMeta(); render();
  }));
  if (!selecting) return;
  const paint = () => {
    $('#ss-count', main).textContent = picked.size ? `${plural(picked.size, 'session')} picked${picked.size === 2 ? '' : picked.size < 2 ? ' · pick two to compare' : ' · compare needs exactly two'}` : 'Pick two sessions to compare, or any to delete.';

    $('#ss-delete', main).disabled = picked.size === 0;
  };
  $$('input[data-id]', main).forEach((c) => (c.onchange = () => { if (c.checked) picked.add(c.dataset.id); else picked.delete(c.dataset.id); paint(); }));
  $('#ss-compare', main).onclick = () => { const [a, b] = [...picked]; go(`#/compare/${a}/${b}`); };
  $('#ss-delete', main).onclick = async () => {
    const list = [...picked].map(findSession).filter(Boolean);
    const names = list.map((f) => fmtDateTime(f.session.created)).join(', ');

    <ul>

    <p>Tap <b>Ready to ride</b>. If the saddle is empty, the app says "walk to the bike and start pedalling"; if someone is already on, "start pedalling when you're ready". Pedal at a steady effort you could hold for an hour (about 80–95 rpm). By default it waits until your cadence is steady, counts ${Settings.v.startStrokes} strokes and records for ${Settings.v.stopSeconds} seconds; the two small buttons at the bottom left change that. It checks the recording before you get off.</p>
    <p>When it asks a question (go again after a bad recording, record a second hand position, stop), answer by <b>raising your right hand above your head for yes</b> or your <b>left hand for no</b>, holding it for a moment; or say "yes" / "again" or "no" / "done" where the browser can listen; or tap the big buttons. It always says what it understood before acting. After a bad recording, doing nothing means it goes again, up to twice.</p>
    <details class="more"><summary>${icon('chevR')}What the beeps mean</summary><dl class="kv" style="margin-top:8px">${BEEP_LEGEND.map(([a2, b2]) => `<dt>${esc(a2)}</dt><dd>${esc(b2)}</dd>`).join('')}</dl></details>

    <p>The results page starts with <b>the one change</b> to make: how much, in both mm and inches, why, and what the retest should show. Below it is <b>your position</b> at the bottom of the pedal stroke with the angles drawn on (tap it to play the recording), then, on a retest, what changed on the bike and how the measurement moved. Playback and the set-up checks are folded away underneath; tap to open them.</p>
    <p>Each measurement is shown against a target range for your bike, riding goal and hand position: <span class="status-good">green</span> is in range, <span class="status-warn">yellow</span> is close, <span class="status-bad">red</span> is outside. Every value also carries a confidence (three bars) based on how clearly the joints were seen and how steady the value was from stroke to stroke. Low-confidence values are greyed out and never drive a recommendation.</p>
    <p>The app recommends <b>one change at a time</b>, in the order fitters use because changes interact: saddle height first, then saddle fore/aft. Amounts are a range in 5 mm steps (for example “raise the saddle 5–10 mm”), never more than 10 mm at a time. Make the change, then tap <b>Retest</b>: the bike marks show whether the change was made and how much the measurement moved. If three rounds of changes have not brought a measurement into range, the app says to see a professional fitter. Reach, drop, bar width and cleats arrive in the next version; their measurements are already shown.</p>

    <h2>Troubleshooting</h2>

      <li><b>“Your feet are cut off.”</b> Move the phone further back or a little higher.</li>
